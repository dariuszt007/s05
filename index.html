<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Lista</title>
  <link rel="stylesheet" href="style.css" />
  <!-- POPRAWIONO: Oficjalna i pełna biblioteka Auth0 z CDN -->
  <script src="https://auth0.com"></script>
</head>
<body>
  <!-- Nowy ekran logowania Auth0 (całkowicie usunięte stare pola na hasło) -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1>Lista 吹田南（小）</h1>
      <p class="login-text">Ta strona jest bezpiecznie chroniona przez Auth0.</p>

      <div class="login-form">
        <button type="button" id="auth0LoginBtn" style="width: 100%; padding: 12px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold;">
          Zaloguj się
        </button>
      </div>
    </div>
  </div>

  <!-- Główna zawartość aplikacji -->
  <div class="app hidden" id="appContent">
    <section class="list-panel">
      <div class="topbar">
        <div class="topbar-header">
          <button type="button" id="toggleToolbarBtn" class="toggle-toolbar-btn">
            Ukryj
          </button>
          <!-- Przycisk wylogowania dla użytkownika -->
          <button type="button" id="auth0LogoutBtn" style="margin-left: 10px; background-color: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 14px;">
            Wyloguj
          </button>
          <p id="syncStatus" class="sync-status" aria-live="polite"></p>
        </div>

        <div class="toolbar" id="toolbar">
          <label class="file-label">
            Import CSV
            <input type="file" id="csvFile" accept=".csv,text/csv" hidden />
          </label>

          <button type="button" id="downloadSampleCsvBtn">Pobierz przykładowy CSV</button>
          <button type="button" id="exportCsvBtn">Eksport CSV</button>
          <button type="button" id="copyBtn">Kopiuj JSON</button>
          <button type="button" id="reloadJsonBtn">Odśwież z JSON</button>
          <button type="button" id="clearLocalBtn">Wyczyść localStorage</button>
          <button type="button" id="addBtn">Dodaj</button>
        </div>

        <div class="filters">
          <select id="filterType">
            <option value="">タイプ</option>
          </select>

          <select id="filterGrade">
            <option value="">年</option>
          </select>

          <select id="filterClass">
            <option value="">組</option>
          </select>

          <select id="filterDuplicate">
            <option value="">端末番号</option>
            <option value="duplicate">duplikaty</option>
            <option value="unique">unikalne</option>
          </select>

          <input
            type="text"
            id="filterName"
            placeholder="Szukaj po imieniu, nazwisku, emailu, 番, 端末番号, 備考"
          />
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th><button type="button" class="sort-btn" data-sort="email">Email</button></th>
              <th><button type="button" class="sort-btn" data-sort="name">名前</button></th>
              <th><button type="button" class="sort-btn" data-sort="type">タイプ</button></th>
              <th><button type="button" class="sort-btn" data-sort="grade">年</button></th>
              <th><button type="button" class="sort-btn" data-sort="className">組</button></th>
              <th><button type="button" class="sort-btn" data-sort="ban">番</button></th>
              <th><button type="button" class="sort-btn" data-sort="deviceNumber">端末番号</button></th>
              <th><button type="button" class="sort-btn" data-sort="usageStatus">使用可否</button></th>
              <th><button type="button" class="sort-btn" data-sort="remarks">備考</button></th>
              <th>Akcje</th>
            </tr>
          </thead>
          <tbody id="teacherTableBody"></tbody>
        </table>
      </div>
    </section>

    <div class="editor">
      <h2>Edytor JSON</h2>
      <textarea id="jsonOutput" spellcheck="false"></textarea>
    </div>
  </div>

  <dialog id="teacherDialog">
    <form id="teacherForm">
      <h3 id="dialogTitle">Dodaj nauczyciela</h3>

      <input type="hidden" id="teacherId" />

      <label>
        Email / lgate
        <input type="text" id="email" />
      </label>

      <label>
        名前
        <input type="text" id="name" />
      </label>

      <label>
        タイプ
        <select id="type">
          <option value="予備機">予備機</option>
          <option value="児童・生徒">児童・生徒</option>
        </select>
      </label>

      <label>
        年
        <input type="text" id="grade" />
      </label>

      <label>
        組
        <input type="text" id="className" />
      </label>

      <label>
        番
        <input type="text" id="ban" inputmode="numeric" />
      </label>

      <label>
        端末番号
        <input type="text" id="deviceNumber" inputmode="numeric" />
      </label>

      <label>
        使用可否
        <select id="usageStatus">
          <option value="使用可">使用可</option>
          <option value="使用不可">使用不可</option>
        </select>
      </label>

      <label>
        備考
        <input type="text" id="remarks" />
      </label>

      <div class="dialog-actions">
        <button type="button" id="cancelBtn">Anuluj</button>
        <button type="submit">Zapisz</button>
      </div>
    </form>
  </dialog>

  <!-- Twój główny skrypt logiki aplikacji -->
  <script src="app.js"></script>

  <!-- Skrypt Auth0 -->
  <script>
    let auth0Client = null;

    // !!! PAMIĘTAJ O PODMIANIE TYCH DWÓCH WARTOŚCI NA SWOJE Z PANELU AUTH0 !!!
    const auth0Config = {
        domain: "TUTAJ_WKLEJ_TWOJE_DOMAIN",
        clientId: "TUTAJ_WKLEJ_TWOJE_CLIENT_ID"
    };

    window.addEventListener('load', async () => {
        // POPRAWIONO: Zmiana klucza z client_id na client_id przy inicjalizacji
        auth0Client = await auth0.createAuth0Client({
            domain: auth0Config.domain,
            client_id: auth0Config.clientId,
            authorizationParams: {
                redirect_uri: window.location.href
            }
        });

        const query = window.location.search;
        if (query.includes("code=") && query.includes("state=")) {
            await auth0Client.handleRedirectCallback();
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        const isAuthenticated = await auth0Client.isAuthenticated();

        if (isAuthenticated) {
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("appContent").classList.remove("hidden");
        } else {
            document.getElementById("loginScreen").classList.remove("hidden");
            document.getElementById("appContent").classList.add("hidden");
        }
    });

    document.getElementById("auth0LoginBtn").addEventListener("click", async () => {
        await auth0Client.loginWithRedirect();
    });

    document.getElementById("auth0LogoutBtn").addEventListener("click", () => {
        auth0Client.logout({
            logoutParams: {
                returnTo: window.location.href
            }
        });
    });
  </script>
</body>
</html>
