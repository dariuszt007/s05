<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Device Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section id="loginScreen" class="login-screen">
      <form id="loginForm" class="login-card">
        <h1>Logowanie</h1>
        <label for="passwordInput">Hasło</label>
        <input id="passwordInput" type="password" autocomplete="current-password" required />
        <button type="submit">Wejdź</button>
        <p id="loginError" class="error-message" hidden>Nieprawidłowe hasło.</p>
      </form>
    </section>

    <section id="appContent" class="hidden">
      <div class="topbar">
        <div class="topbar-header">
          <h1>Teacher Device Manager</h1>
          <button id="toggleToolbarBtn" type="button" class="toggle-toolbar-btn">Ukryj</button>
        </div>

        <div id="toolbar" class="toolbar">
          <label class="file-label" for="csvFile">Import CSV</label>
          <input id="csvFile" type="file" accept=".csv" hidden />

          <button id="refreshBtn" type="button">Odswież</button>
          <button id="downloadSampleCsvBtn" type="button">Pobierz wzór CSV</button>
          <button id="exportCsvBtn" type="button">Eksport CSV</button>
          <button id="copyBtn" type="button">Kopiuj JSON</button>
          <button id="addBtn" type="button">Dodaj</button>
        </div>

        <div class="filters">
          <select id="filterType">
            <option value="">タイプ</option>
          </select>

          <select id="filterGrade">
            <option value="">年</option>
          </select>

          <select id="filterClass">
            <option value="">組</option>
          </select>

          <select id="filterDuplicate">
            <option value="">端末番号</option>
            <option value="duplicate">Duplikaty</option>
            <option value="unique">Unikalne</option>
          </select>

          <input id="filterName" type="text" placeholder="Szukaj..." />
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th><button type="button" class="sort-btn" data-sort="email">Email / lgate</button></th>
              <th><button type="button" class="sort-btn" data-sort="name">名前</button></th>
              <th><button type="button" class="sort-btn" data-sort="type">タイプ</button></th>
              <th><button type="button" class="sort-btn" data-sort="grade">年</button></th>
              <th><button type="button" class="sort-btn" data-sort="className">組</button></th>
              <th><button type="button" class="sort-btn" data-sort="ban">班</button></th>
              <th><button type="button" class="sort-btn" data-sort="deviceNumber">端末番号</button></th>
              <th><button type="button" class="sort-btn" data-sort="usageStatus">使用状況</button></th>
              <th><button type="button" class="sort-btn" data-sort="remarks">備考</button></th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="teacherTableBody"></tbody>
        </table>
      </div>

      <div class="editor">
        <h2>Edytor JSON</h2>
        <textarea id="jsonOutput" spellcheck="false"></textarea>
      </div>
    </section>
  </main>

  <dialog id="teacherDialog">
    <form id="teacherForm" method="dialog">
      <h2 id="dialogTitle">Dodaj</h2>
      <input type="hidden" id="teacherId" />

      <label for="email">Email / lgate</label>
      <input id="email" type="text" />

      <label for="name">名前</label>
      <input id="name" type="text" required />

      <label for="type">タイプ</label>
      <select id="type">
        <option value="予備機">予備機</option>
        <option value="児童・生徒">児童・生徒</option>
      </select>

      <label for="grade">年</label>
      <input id="grade" type="text" />

      <label for="className">組</label>
      <input id="className" type="text" />

      <label for="ban">班</label>
      <input id="ban" type="text" />

      <label for="deviceNumber">端末番号</label>
      <input id="deviceNumber" type="text" />

      <label for="usageStatus">使用状況</label>
      <select id="usageStatus">
        <option value="使用可">使用可</option>
        <option value="使用不可">使用不可</option>
      </select>

      <label for="remarks">備考</label>
      <textarea id="remarks"></textarea>

      <div class="dialog-actions">
        <button type="submit">Zapisz</button>
        <button id="cancelBtn" type="button">Anuluj</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
